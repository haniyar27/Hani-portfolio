backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

site_url: https://haniyar.art
display_url: https://haniyar.art
logo_url: ""

collections:

  - name: "site"
    label: "Homepage"
    files:
      - name: "home"
        label: "Home / Intro"
        file: "content/site.json"
        fields:
          - { label: "Hero Greeting (small line above name)", name: "heroHi", widget: "string" }
          - { label: "Hero Title (HTML ok, e.g. <em>word</em> for italics)", name: "heroTitle", widget: "string" }
          - { label: "Role / Title", name: "role", widget: "string" }
          - { label: "Hero Short Blurb (one line)", name: "heroBlurb", widget: "string" }
          - { label: "Full Intro (separate paragraphs with a blank line)", name: "intro", widget: "text" }

  - name: "experience"
    label: "Experience"
    files:
      - name: "experience_list"
        label: "All Workplaces"
        file: "content/experience.json"
        fields:
          - label: "Workplaces"
            name: "items"
            widget: "list"
            root: true
            fields:
              - { label: "URL Slug (no spaces, e.g. sheraton-bahrain)", name: "slug", widget: "string" }
              - { label: "Sort Order (higher = shows first)", name: "order", widget: "number", value_type: "int" }
              - { label: "Company", name: "company", widget: "string" }
              - { label: "Role / Title", name: "role", widget: "string" }
              - { label: "Start Date (e.g. Aug 2024)", name: "startDate", widget: "string" }
              - { label: "End Date (leave blank if current)", name: "endDate", widget: "string", required: false }
              - label: "Responsibilities (bullet points)"
                name: "bullets"
                widget: "list"
                field: { label: "Bullet", name: "bullet", widget: "string" }
              - label: "Highlights"
                name: "highlights"
                widget: "list"
                required: false
                fields:
                  - { label: "Highlight Title", name: "title", widget: "string" }
                  - label: "Key Points (short bullets)"
                    name: "points"
                    widget: "list"
                    required: false
                    field: { label: "Point", name: "point", widget: "string" }
                  - { label: "Story (separate paragraphs with a blank line)", name: "story", widget: "text", required: false }
                  - label: "Media (photos / videos / PDFs / links)"
                    name: "media"
                    widget: "list"
                    required: false
                    fields:
                      - { label: "Type", name: "type", widget: "select", options: ["image", "video", "pdf", "link"] }
                      - { label: "File (upload) OR paste a link URL here", name: "url", widget: "file" }
                      - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "creative-work"
    label: "Creative Work"
    files:
      - name: "creative_work_list"
        label: "All Projects"
        file: "content/creative-work.json"
        fields:
          - label: "Projects"
            name: "items"
            widget: "list"
            root: true
            fields:
              - { label: "URL Slug (unique, no spaces)", name: "slug", widget: "string" }
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "select", options: [
                    { label: "Branding & Identity", value: "branding" },
                    { label: "Media (Photo / Video)", value: "media" },
                    { label: "Experiments", value: "experiments" }
                  ] }
              - { label: "Year", name: "year", widget: "number", value_type: "int", required: false }
              - { label: "Short Description", name: "description", widget: "text", required: false }
              - label: "Media (photos / videos / PDFs / links — first item is the cover)"
                name: "media"
                widget: "list"
                fields:
                  - { label: "Type", name: "type", widget: "select", options: ["image", "video", "pdf", "link"] }
                  - { label: "File (upload) OR paste a link URL here", name: "url", widget: "file" }
                  - { label: "Caption", name: "caption", widget: "string", required: false }

  - name: "certificates"
    label: "Certificates & Awards"
    files:
      - name: "certificates_list"
        label: "All Certificates"
        file: "content/certificates.json"
        fields:
          - label: "Certificates"
            name: "items"
            widget: "list"
            root: true
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Issuer", name: "issuer", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "number", value_type: "int" }
              - { label: "Period Label (groups entries together, e.g. 2023)", name: "period", widget: "string" }
